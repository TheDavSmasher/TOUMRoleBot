name: update_instance.yml
on:
  push:
    branches:
      - master

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DAV_HOST_PEM }}

      - name: Update EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: "ubuntu"
          key: ${{ secrets.DAV_HOST_PEM }}
          script: |
            cd ${{ github.event.repository.name }}

            kill $(cat ${{ vars.MAIN_SCRIPT }}.pid)
            rm -f ${{ vars.MAIN_SCRIPT }}.pid

            git pull git@github.com:${{ github.repository }}.git
            source toum_env/bin/activate
            TOKEN="${{ secrets.DISCORD_TOKEN }}" nohup python3.13 ${{ vars.MAIN_SCRIPT }}.py > /dev/null 2>&1 < /dev/null &
            echo $! > ${{ vars.MAIN_SCRIPT }}.pid
